name: Release

on:
  push:
    tags: ['release-*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, licensing-release]
    steps:
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Print platform
        run: node tools/release/platform.mjs
      - name: Release check
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: node tools/release/check.mjs "${{ github.ref_name }}"
      - name: Tool tests
        run: node --test "tools/release/*.test.mjs"
      - name: Build
        run: dotnet build Umbraco.Community.Licensing.slnx -c Release -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test --solution Umbraco.Community.Licensing.slnx -c Release --no-build
      - name: Pack
        run: dotnet pack src/Umbraco.Community.Licensing.Core/Umbraco.Community.Licensing.Core.csproj -c Release --no-build -o "${{ runner.temp }}/packages"
      - name: NuGet login
        if: github.event_name == 'push' && github.ref_type == 'tag'
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to NuGet
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: dotnet nuget push "${{ runner.temp }}/packages/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
