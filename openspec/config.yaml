schema: spec-driven

context: |
  Product: an offline license key library for .NET (issue, validate, signing-key management).
  Roles, hats, decision records and project constraints: CLAUDE.md. Personas and their
  priority order: docs/personas.md.

rules:
  proposal:
    - No implementation or technology content; that belongs in design.md or an ADR.
  design:
    - Name the bar (throwaway / prototype / production) and the test strategy that follows.
    - Each technology decision has a matching ADR, cross-referenced from the section that made it.
  specs:
    - Behaviour only; no technology, no ADR citations.
    - Every requirement has at least one "#### Scenario:" block with WHEN/THEN.
  tasks:
    - Sections follow component boundaries and the worker ownership map in CLAUDE.md.
    - Each section notes the sections it depends on.
    - Every task ends with an "and verify…" clause naming an automated check or a human observation.

operations:
  apply:
    guidance:
      - Follow the "Apply-phase team" section of CLAUDE.md. Read openspec/changes/<change>/follow-ups.md first if it exists.
